<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Sarath Eats</title>
<style>
  /* ── Shared tokens (same as index.html) ── */
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --border:#2c313c;
    --text:#f2f3f5; --sub:#9aa1ad; --accent:#4fd1a5; --accent2:#3aa683;
    --warn:#e8b84b; --danger:#e8695f;
  }
  @media(prefers-color-scheme:light){
    :root{
      --bg:#f4f6f9; --card:#ffffff; --card2:#edf0f5; --border:#cdd2de;
      --text:#111827; --sub:#6b7280; --accent:#2da87c; --accent2:#258a67;
      --warn:#b45309; --danger:#dc3545;
    }
    header{box-shadow:0 1px 3px rgba(0,0,0,.07);}
    .google-btn{box-shadow:0 1px 4px rgba(0,0,0,.12);border:1px solid #e5e7eb;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  button{font-family:inherit;}

  /* ── Auth screen ── */
  #auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;}
  .auth-logo{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
  .auth-sub{font-size:14px;color:var(--sub);margin-bottom:36px;line-height:1.5;}
  .google-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#1f2937;border:none;border-radius:12px;padding:13px 24px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);min-height:44px;}
  .google-btn svg{width:18px;height:18px;flex-shrink:0;}
  #auth-error{margin-top:20px;font-size:12px;color:var(--danger);max-width:300px;line-height:1.5;}

  /* ── App shell ── */
  #app-shell{display:none;}
  header{position:sticky;top:0;background:var(--bg);z-index:20;padding:12px 16px 10px;border-bottom:1px solid var(--border);}
  .header-top{display:flex;align-items:center;justify-content:space-between;}
  h1{font-size:17px;margin:0;font-weight:700;}
  .hdr-btns{display:flex;gap:6px;}
  .txt-btn{background:none;border:1px solid var(--border);color:var(--accent);font-size:11.5px;font-weight:600;padding:5px 10px;cursor:pointer;border-radius:8px;}
  .txt-btn.muted{color:var(--sub);border-color:transparent;}
  main{padding:6px 10px 0;}
  .view{display:none;}
  .view.active{display:block;}
  .loading{padding:40px 16px;text-align:center;color:var(--sub);font-size:13px;}
  .placeholder{padding:48px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.6;}
  .fatal{padding:40px 20px;text-align:center;color:var(--danger);font-size:13px;line-height:1.6;}

  /* ── Cards & buttons ── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .card-title{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:0 0 10px;font-weight:700;}
  .btn{flex:1;padding:11px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;font-weight:600;text-align:center;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#062018;border-color:var(--accent);}
  .btn.danger-outline{color:var(--danger);border-color:rgba(232,105,95,0.4);background:transparent;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-row{display:flex;gap:8px;margin-top:12px;}

  /* ── Tab bar ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;background:none;border:none;color:var(--sub);font-size:10.5px;font-weight:600;cursor:pointer;}
  .tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tab.active{color:var(--accent);}

  /* ── Toast ── */
  .toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:8px 18px;border-radius:20px;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:500;white-space:nowrap;display:flex;align-items:center;gap:12px;}
  .toast.show{opacity:1;pointer-events:auto;}
  .toast-action{background:none;border:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 0;}

  /* ── Confirm modal (same as index.html) ── */
  #confirm-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end;justify-content:center;padding:0 12px 24px;}
  #confirm-modal.open{display:flex;}
  .confirm-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;width:100%;max-width:400px;text-align:center;}
  .confirm-title{font-size:15px;font-weight:700;margin-bottom:6px;}
  .confirm-sub{font-size:13px;color:var(--sub);margin-bottom:18px;line-height:1.5;}
  .confirm-btns{display:flex;gap:8px;}
</style>
</head>
<body>

<!-- ── Auth screen ─────────────────────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-logo">Sarath Eats</div>
  <p class="auth-sub">Sign in with Google to sync your food log<br>across every device.</p>
  <button class="google-btn" onclick="signIn()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </button>
  <div id="auth-error"></div>
</div>

<!-- ── App shell ───────────────────────────────────────────────────────────── -->
<div id="app-shell">
  <header>
    <div class="header-top">
      <h1>Sarath Eats</h1>
      <div class="hdr-btns">
        <button class="txt-btn muted" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="view active" id="view-today"><div class="loading">Loading…</div></section>
    <section class="view" id="view-week"><div class="placeholder">Weekly view is coming soon.</div></section>
    <section class="view" id="view-trends"><div class="placeholder">Weight and intake trends are coming soon.</div></section>
    <section class="view" id="view-foods"><div class="placeholder">Your food library is coming soon.</div></section>
    <section class="view" id="view-more"><div class="placeholder">Settings are coming soon.</div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/></svg>Today
    </button>
    <button class="tab" data-tab="week">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week
    </button>
    <button class="tab" data-tab="trends">
      <svg viewBox="0 0 24 24"><path d="M3.5 17l5-5.5 4 3.5 7.5-8"/><path d="M15 7h5v5"/></svg>Trends
    </button>
    <button class="tab" data-tab="foods">
      <svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg>Foods
    </button>
    <button class="tab" data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>More
    </button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ── Confirm modal ───────────────────────────────────────────────────────── -->
<div id="confirm-modal">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-btns">
      <button class="btn" id="confirm-cancel">Cancel</button>
      <button class="btn danger-outline" id="confirm-ok">OK</button>
    </div>
  </div>
</div>

<!-- ── Firebase SDKs (CDN, no build step needed) ──────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ═════════════════════════════════════════════════════════════════════════════
// ---- CONFIG
// ═════════════════════════════════════════════════════════════════════════════
// Same Firebase project as Sarath Lifts and Sarath Invests. Web config values
// are public identifiers; access control is the Firestore rules (see README).
const firebaseConfig = {
  apiKey:            "AIzaSyAv-8nTj8rYEKoVteVMMEGRW6tGM75VVMc",
  authDomain:        "shirtoff-tracker.firebaseapp.com",
  projectId:         "shirtoff-tracker",
  storageBucket:     "shirtoff-tracker.firebasestorage.app",
  messagingSenderId: "646335256810",
  appId:             "1:646335256810:web:282936e1b9c60ed1fc5f93"
};

// ═════════════════════════════════════════════════════════════════════════════
// ---- PURE LOGIC START (no DOM, no Firebase; tests/food-logic.test.mjs loads this block)
// ═════════════════════════════════════════════════════════════════════════════
const FoodLogic = (() => {
  // ── Dates (always local, never UTC) ──
  function localDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function parseDateStr(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(dateStr, n) {
    const d = parseDateStr(dateStr);
    d.setDate(d.getDate() + n);
    return localDateStr(d);
  }

  return { localDateStr, parseDateStr, addDays };
})();
// ═════════════════════════════════════════════════════════════════════════════
// ---- PURE LOGIC END
// ═════════════════════════════════════════════════════════════════════════════

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (_) {}

// ═════════════════════════════════════════════════════════════════════════════
// ---- STATE
// ═════════════════════════════════════════════════════════════════════════════
let currentUser = null;
let activeTab   = 'today';

// ═════════════════════════════════════════════════════════════════════════════
// ---- UI: shared helpers
// ═════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer = null;
// showToast(msg) or showToast(msg, { action: 'Undo', onAction: fn, ms: 5000 })
function showToast(msg, opts = {}) {
  const t = $('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if (opts.action) {
    const b = document.createElement('button');
    b.className = 'toast-action';
    b.textContent = opts.action;
    b.onclick = () => { hideToast(); opts.onAction(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.ms || 1800);
}
function hideToast() { $('toast').classList.remove('show'); }

// Styled confirm (no native confirm()). Resolves true / false.
function confirmModal(title, sub, okLabel = 'OK') {
  return new Promise(resolve => {
    $('confirm-title').textContent = title;
    $('confirm-sub').textContent = sub;
    $('confirm-ok').textContent = okLabel;
    const modal = $('confirm-modal');
    const done = v => { modal.classList.remove('open'); resolve(v); };
    $('confirm-ok').onclick = () => done(true);
    $('confirm-cancel').onclick = () => done(false);
    modal.onclick = e => { if (e.target === modal) done(false); };
    modal.classList.add('open');
  });
}

// ── Tabs ──
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  window.scrollTo(0, 0);
}
$('tabbar').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) switchTab(b.dataset.tab);
});

// ═════════════════════════════════════════════════════════════════════════════
// ---- UI: Today
// ═════════════════════════════════════════════════════════════════════════════
function renderToday() {
  $('view-today').innerHTML = '<div class="placeholder">Tap + Add to log your first meal.</div>';
}

// ═════════════════════════════════════════════════════════════════════════════
// ---- BOOT
// ═════════════════════════════════════════════════════════════════════════════
window.signIn = () => {
  $('auth-error').textContent = '';
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e => { $('auth-error').textContent = 'Sign-in failed: ' + e.message; });
};
window.signOut = () => auth.signOut();

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    $('auth-screen').style.display = 'none';
    $('app-shell').style.display   = 'block';
    switchTab('today');
    renderToday();
  } else {
    currentUser = null;
    $('auth-screen').style.display = 'flex';
    $('app-shell').style.display   = 'none';
  }
});
</script>
</body>
</html>
